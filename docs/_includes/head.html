<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include title.html %}
{% seo title=false %}
<meta name="keywords" content="terraform ui, terraform tui, tfui, terraform plan viewer, terraform state browser, k9s terraform, terraform interactive, opentofu ui, terraform terminal, terraform plan review">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/space-grotesk-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/jetbrains-mono-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
{%- if page.layout != "home" %}
<link rel="stylesheet" href="{{ '/pagefind/pagefind-ui.css' | relative_url }}">
<script src="{{ '/pagefind/pagefind-ui.js' | relative_url }}" defer onerror="document.documentElement.classList.add('no-search')"></script>
{%- endif %}
<script>window.TFUI = { base: "{{ site.baseurl }}" };</script>
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "tfui",
  "alternateName": "terraform-ui",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Linux, macOS, Windows",
  "description": "Interactive terminal UI for Terraform. Navigate plan changes as a tree, analyze risk, browse state, and apply, all keyboard-driven.",
  "url": "{{ site.url }}{{ site.baseurl }}",
  "downloadUrl": "{{ site.source_url }}/releases",
  "license": "https://opensource.org/licenses/MIT",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
{%- if site.ga_tracking and jekyll.environment == "production" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_tracking }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.ga_tracking }}');</script>
{%- endif %}
