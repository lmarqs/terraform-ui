[tools]
"aqua:steveyegge/beads" = "1.3.1"
"github:akitaonrails/ai-jail" = "3"
"github:Dicklesworthstone/beads_viewer" = "0.25.2"
"github:lmarqs/the-cook" = "12.2.0"
"npm:ralph-tui" = "0.12.0"
bun = "1.3"
gh = "2.92"
go = "1.25"
golangci-lint = "2.12"
goreleaser = "2.15"
node = "22.21"
ruby = "3.4"
terraform = "1.14"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = ".env"

[settings]
# ralph-tui runs on bun, and mise's default npm installer refuses it for its low weekly downloads.
npm.package_manager = "bun"
