configVersion = "2.1"
tracker = "beads-bv"
# ralph-tui stops a run after this many iterations, each one agent run on one task; 0 means no limit.
maxIterations = 10
autoCommit = true

[errorHandling]
strategy = "retry"
maxRetries = 2
continueOnNonZeroExit = false

[parallel]
directMerge = true

# ralph-tui's beads trackers find no tasks unless this directory exists. .beads/config.yaml is committed, so it
# exists in every worktree, parallel workers' included, and bd still finds the main checkout's database itself.
[trackerOptions]
beadsDir = ".beads"

[[agents]]
name = "claude"
plugin = "claude"
command = ".ralph-tui/bin/worker-claude"
defaultFlags = ["--permission-prompts", "none", "--permission-mode", "acceptEdits", "--settings", ".agents/adapters/claude/roles/worker.json"]

[agents.options]
skipPermissions = false

[[agents]]
name = "codex"
plugin = "codex"
command = ".ralph-tui/bin/worker-codex"
defaultFlags = ["--dangerously-bypass-hook-trust", "-c", "approval_policy=never", "-c", "shell_environment_policy.set.MISE_CACHE_DIR=\"/tmp/tfui-ralph-mise\""]

[agents.options]
fullAuto = false
sandbox = "danger-full-access"
